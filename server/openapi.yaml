openapi: 3.0.3
info:
  title: Virtuoso Drive API
  version: 1.0.0
  description: >
    The operations of the thin slice (Unit U1), following the conventions of
    contract C1. A test checks this file against the server's declared list of
    operations.
servers:
  - url: https://virtuoso.andrefellipelabs.com/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Says whether the server and its database are answering
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Healthy
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        "503":
          $ref: "#/components/responses/Problem"
  /site-information:
    get:
      operationId: getSiteInformation
      summary: Says when the site was installed, which version is running and in which environment
      description: >
        The slice's one trivial route. It exists to prove that the page, the
        server and the database connect; a later Unit may remove it.
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The server and its database answered
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStatus"
        "400":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{1,64}$"
      description: >
        Echoed in the response and written to the logs. Generated by the
        server when absent or malformed.
  responses:
    Problem:
      description: Any failure
      headers:
        X-Request-Id:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    SiteStatus:
      type: object
      required: [installedAt, version, environment]
      properties:
        installedAt:
          type: string
          format: date-time
          description: When the first database change was applied, in UTC
        version:
          type: string
          description: The Release that is running
        environment:
          type: string
          enum: [test, production]
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: A URI identifying the kind of problem
        title:
          type: string
          description: Short text, not shown to users as is
        status:
          type: integer
        code:
          type: string
          description: >
            The stable value the page switches on. The slice answers with
            these three of the codes contract C1 lists.
          enum:
            - invalidInput
            - notFound
            - serverError
        detail:
          type: string
