openapi: 3.0.3
info:
  title: Virtuoso Drive API
  version: 1.0.0
  description: >
    The operations of the thin slice (Unit U1) and of browsing (Unit U3,
    contract C3), following the conventions of contract C1. A test checks
    this file against the server's declared list of operations.
servers:
  - url: https://virtuoso.andrefellipelabs.com/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Says whether the server and its database are answering
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Healthy
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        "503":
          $ref: "#/components/responses/Problem"
  /site-information:
    get:
      operationId: getSiteInformation
      summary: Says when the site was installed, which version is running and in which environment
      description: >
        The slice's one trivial route. It exists to prove that the page, the
        server and the database connect; a later Unit may remove it.
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The server and its database answered
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStatus"
        "400":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /folders/{folderId}:
    get:
      operationId: getFolder
      summary: A folder, its path from the top, and its visible contents
      description: >
        Use the identifier root for the top folder, "All". Send the version
        last received in If-None-Match; the answer is 304 with no body when
        nothing in the folder has changed. Anyone may ask: no session is
        needed. A folder that is unknown, deleted or inside a deleted folder,
        and an identifier that is not of the generated form, all get the same
        404. No answer may be stored.
      security: []
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
          description: The identifier root, or a folder's generated identifier
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
          description: The version last received for this folder
        - name: X-Accept-Gzip
          in: header
          required: false
          schema:
            type: string
            enum: ["1"]
          description: >
            Send the value 1 to say that a gzip answer can be read. The answer
            is compressed only for a caller that sends it, and then only when
            that is the smaller form to send. Without it, or with any other
            value, the answer is plain. A header of this interface's own: the
            server does not read the standard request header for accepted
            encodings, which does not reach it.
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The folder
          headers:
            ETag:
              schema:
                type: string
              description: The folder's version; opaque to the caller
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            Content-Encoding:
              schema:
                type: string
                enum: [gzip]
              description: Present when the answer is compressed
            Vary:
              schema:
                type: string
                enum: [X-Accept-Gzip]
              description: The answer depends on whether X-Accept-Gzip was sent
            Server-Timing:
              schema:
                type: string
              description: The time the server took to build the answer
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderView"
        "304":
          description: Unchanged since the version sent; no body
          headers:
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{1,64}$"
      description: >
        Echoed in the response and written to the logs. Generated by the
        server when absent or malformed.
  responses:
    Problem:
      description: Any failure
      headers:
        X-Request-Id:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    SiteStatus:
      type: object
      required: [installedAt, version, environment]
      properties:
        installedAt:
          type: string
          format: date-time
          description: When the first database change was applied, in UTC
        version:
          type: string
          description: The Release that is running
        environment:
          type: string
          enum: [test, production]
    FolderView:
      type: object
      required: [folderId, name, path, items]
      properties:
        folderId:
          type: string
          description: The folder's own identifier, also when root was asked for
        name:
          type: string
        path:
          type: array
          description: From "All" to this folder, in order, both included
          items:
            type: object
            required: [folderId, name]
            properties:
              folderId:
                type: string
              name:
                type: string
        items:
          type: array
          description: Visible items only, lowest position first
          items:
            $ref: "#/components/schemas/Item"
    Item:
      type: object
      required: [itemId, kind, name]
      properties:
        itemId:
          type: string
        kind:
          type: string
          enum: [folder, file]
        name:
          type: string
          description: Plain text; never markup to be interpreted
        size:
          type: integer
          format: int64
          minimum: 0
          description: Files only; whole bytes
        contentType:
          type: string
          description: Files only, when one was recorded; chooses the icon
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: A URI identifying the kind of problem
        title:
          type: string
          description: Short text, not shown to users as is
        status:
          type: integer
        code:
          type: string
          description: >
            The stable value the page switches on. The slice answers with
            these three of the codes contract C1 lists.
          enum:
            - invalidInput
            - notFound
            - serverError
        detail:
          type: string
