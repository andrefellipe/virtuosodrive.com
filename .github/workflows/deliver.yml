# From a merged change to production (pipeline design, "deliver"): build the
# Release once; deploy it to test; verify it; after the maintainer's approval,
# deploy the same Release, unchanged, to production.
name: deliver

on:
  push:
    branches: [aws-migration]

permissions:
  contents: read

jobs:
  build:
    name: Build the Release once
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: The Release's version is the commit's short identifier
        id: version
        run: echo "version=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"

      - run: npm ci

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/src/build.ts "${VERSION}"
          for package in server db-migrate placeholder; do
            (cd "dist/${package}" && zip -qr "../${package}.zip" .)
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/server.zip
            dist/db-migrate.zip
            dist/placeholder.zip
            dist/edge/
            dist/web/
            dist/release.json
          if-no-files-found: error
          retention-days: 90

  test:
    name: Test environment
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # One Release at a time passes through the test environment.
    concurrency:
      group: deliver-test
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      deployments: write
      actions: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Take the test environment's identity (one hour, no stored keys)
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          # A secret, so that GitHub masks it in the log; the variable of the
          # same name is read only until the setup script has been run again
          # (docs/operations.md, procedure 1).
          role-to-assume: ${{ secrets.AWS_ROLE_TEST || vars.AWS_ROLE_TEST }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600

      # The first act with the identity: from here to the end of the job the
      # account's number is replaced by *** wherever a step prints it
      # (Terraform's plan, bucket names, AWS's error messages).
      - name: Keep the AWS account's number out of this job's log
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::${ACCOUNT_ID}"

      - name: Deploy to test
        uses: ./.github/actions/deploy
        with:
          environment: test
          version: ${{ env.VERSION }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}
          github-token: ${{ github.token }}

      - name: Install for the end-to-end tests
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests, in three browser engines at two widths
        env:
          VD_ENVIRONMENT: test
          VD_EXPECTED_VERSION: ${{ env.VERSION }}
        run: VD_BASE_URL="${SITE_URL}" npm run e2e

      # Paced by the script itself at 8 calls a second at most, under this
      # environment's request limit of 10 a second; about 15 seconds.
      - name: The 100-call measurement (95 of 100 within 1 second)
        env:
          VD_ENVIRONMENT: test
        run: VD_BASE_URL="${SITE_URL}" node scripts/src/cli.ts measure

      # The four gates of browsing (Unit U3). Each fails the run, and with it
      # blocks production, as the end-to-end tests do. The first two are what
      # proves that the edge passes the version and the accepted encodings in
      # and the version and a compressed answer out: nothing short of a
      # deployed environment can. They rest on the sample content.
      - name: "Gate: a folder asked for again with its version answers unchanged, through the whole path"
        env:
          VD_ENVIRONMENT: test
        run: VD_BASE_URL="${SITE_URL}" node scripts/src/cli.ts gate unchanged

      - name: "Gate: the 500-item folder arrives compressed, through the whole path"
        env:
          VD_ENVIRONMENT: test
        run: VD_BASE_URL="${SITE_URL}" node scripts/src/cli.ts gate compressed

      # 100 requests at 5 a second, under the request limit of 10; about 20
      # seconds. The figure is the server's own, from the Server-Timing header.
      - name: "Gate: folder speed (95 of 100 within 500 milliseconds at the server)"
        env:
          VD_ENVIRONMENT: test
        run: VD_BASE_URL="${SITE_URL}" node scripts/src/cli.ts gate speed

      - name: "Gate: a folder's answer is not stored on the way"
        env:
          VD_ENVIRONMENT: test
        run: VD_BASE_URL="${SITE_URL}" node scripts/src/cli.ts gate not-stored

      - name: "Compatibility: the Release running in production, its end-to-end tests against this server"
        # The second half of the compatibility check (reliability design R5).
        # The first half is in the pull request's checks: the earlier
        # Release's tests of its server against the new database changes.
        #
        # Here the Release running in production is checked out beside this
        # one, and its own end-to-end tests are run against the test
        # environment, which now runs the new server. Not all of them: the
        # test environment serves the NEW page, so the earlier Release's
        # tests of what its own page shows cannot pass and are not run. What
        # is run are its tests of the server's operations and of the access
        # gate (scripts/src/earlier-release-tests.ts says which, and why).
        # A failure blocks the Release, as the gates above do.
        env:
          GH_TOKEN: ${{ github.token }}
          VD_ENVIRONMENT: test
          # The earlier Release's tests must not expect its own version here.
          VD_EXPECTED_VERSION: ""
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=releases-production&per_page=100" > production-deployments.json
          read -r RELEASE SHA _ <<< "$(node scripts/src/deployment-record.ts running < production-deployments.json) - - -"
          if [ "${RELEASE}" = "-" ]; then
            echo "No Release runs in production yet, so there is no earlier Release to check."
            exit 0
          fi
          if [ "${SHA}" = "${GITHUB_SHA}" ]; then
            echo "Production already runs this Release; there is no earlier one to check."
            exit 0
          fi
          git worktree add --detach "../earlier-${RELEASE}" "${SHA}"
          if [ ! -d "../earlier-${RELEASE}/e2e/tests" ]; then
            echo "::error::Release ${RELEASE} does not have its end-to-end tests where this check expects them. The check proved nothing and fails."
            exit 1
          fi
          PATTERN="$(node scripts/src/earlier-release-tests.ts "../earlier-${RELEASE}/e2e/tests")"
          echo "Release ${RELEASE}: running its end-to-end tests that match: ${PATTERN}"
          (
            cd "../earlier-${RELEASE}"
            npm ci
            npx playwright install chromium firefox webkit
            VD_BASE_URL="${SITE_URL}" npx playwright test --config e2e/playwright.config.ts --grep "${PATTERN}"
          ) < /dev/null
          echo "NOTE: Release ${RELEASE}'s tests of what its own page shows were not run: the test environment serves the new page. They are the part of this check that is still missing."

      - name: This Release is verified; earlier ones still waiting for approval are superseded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "${GITHUB_REPOSITORY}" --workflow deliver.yml --status waiting \
            --json databaseId,number --jq ".[] | select(.number < ${GITHUB_RUN_NUMBER}) | .databaseId" |
            while read -r RUN; do
              echo "Cancelling run ${RUN}: its Release is superseded and can no longer be approved."
              gh run cancel "${RUN}" --repo "${GITHUB_REPOSITORY}"
            done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  production:
    name: Production
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Starts only after the maintainer approves; accepts only this branch.
    environment: production
    # One Deployment at a time in production.
    concurrency:
      group: deliver-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      deployments: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Take production's identity (one hour, no stored keys)
        id: identity
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_PRODUCTION || vars.AWS_ROLE_PRODUCTION }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Keep the AWS account's number out of this job's log
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::${ACCOUNT_ID}"

      - name: Deploy the same Release, unchanged, to production
        uses: ./.github/actions/deploy
        with:
          environment: production
          version: ${{ env.VERSION }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}
          pause-seconds: "120"
          github-token: ${{ github.token }}

      - name: Tell the maintainer that the production deployment failed
        if: failure() && steps.identity.outcome == 'success'
        env:
          ALARM_TOPIC_ARN: ${{ secrets.ALARM_TOPIC_ARN || vars.ALARM_TOPIC_ARN }}
        run: |
          aws sns publish --topic-arn "${ALARM_TOPIC_ARN}" \
            --subject "Virtuoso Drive, production: deployment failed" \
            --message "The deployment of Release ${VERSION} to production failed. Production runs what the run's summary says. Open the run first: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} . Going back to the previous version is your decision: start the go-back workflow for production."
