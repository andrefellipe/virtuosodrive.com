# From a merged change to production (pipeline design, "deliver"): build the
# Release once; deploy it to test; verify it; after the maintainer's approval,
# deploy the same Release, unchanged, to production.
name: deliver

on:
  push:
    branches: [aws-migration]

permissions:
  contents: read

jobs:
  build:
    name: Build the Release once
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: The Release's version is the commit's short identifier
        id: version
        run: echo "version=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"

      - run: npm ci

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/src/build.ts "${VERSION}"
          for package in server db-migrate placeholder; do
            (cd "dist/${package}" && zip -qr "../${package}.zip" .)
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/server.zip
            dist/db-migrate.zip
            dist/placeholder.zip
            dist/edge/
            dist/web/
            dist/release.json
          if-no-files-found: error
          retention-days: 90

  test:
    name: Test environment
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # One Release at a time passes through the test environment.
    concurrency:
      group: deliver-test
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      deployments: write
      actions: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Take the test environment's identity (one hour, no stored keys)
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TEST }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Deploy to test
        uses: ./.github/actions/deploy
        with:
          environment: test
          version: ${{ env.VERSION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          github-token: ${{ github.token }}

      - name: Install for the end-to-end tests
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests, in three browser engines at two widths
        env:
          VD_ENVIRONMENT: test
          VD_EXPECTED_VERSION: ${{ env.VERSION }}
        run: VD_BASE_URL="${SITE_URL}" npm run e2e

      - name: The 100-call measurement (95 of 100 within 1 second)
        env:
          VD_ENVIRONMENT: test
        run: VD_BASE_URL="${SITE_URL}" node scripts/src/cli.ts measure

      - name: This Release is verified; earlier ones still waiting for approval are superseded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "${GITHUB_REPOSITORY}" --workflow deliver.yml --status waiting \
            --json databaseId,number --jq ".[] | select(.number < ${GITHUB_RUN_NUMBER}) | .databaseId" |
            while read -r RUN; do
              echo "Cancelling run ${RUN}: its Release is superseded and can no longer be approved."
              gh run cancel "${RUN}" --repo "${GITHUB_REPOSITORY}"
            done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  production:
    name: Production
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Starts only after the maintainer approves; accepts only this branch.
    environment: production
    # One Deployment at a time in production.
    concurrency:
      group: deliver-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      deployments: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Take production's identity (one hour, no stored keys)
        id: identity
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PRODUCTION }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Deploy the same Release, unchanged, to production
        uses: ./.github/actions/deploy
        with:
          environment: production
          version: ${{ env.VERSION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          pause-seconds: "120"
          github-token: ${{ github.token }}

      - name: Tell the maintainer that the production deployment failed
        if: failure() && steps.identity.outcome == 'success'
        env:
          ALARM_TOPIC_ARN: ${{ vars.ALARM_TOPIC_ARN }}
        run: |
          aws sns publish --topic-arn "${ALARM_TOPIC_ARN}" \
            --subject "Virtuoso Drive, production: deployment failed" \
            --message "The deployment of Release ${VERSION} to production failed. Production runs what the run's summary says. Open the run first: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} . Going back to the previous version is your decision: start the go-back workflow for production."
