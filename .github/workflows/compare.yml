# Reports anything in AWS that differs from what the repository defines
# (rules BR4.4). It runs Terraform's plan and applies nothing; it reports
# differences and does not correct them.
#
# Weekly for test. For production only when the maintainer starts it by hand
# and approves, because it runs with production's ordinary identity.
name: compare

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to compare with the repository
        required: true
        type: choice
        options: [test, production]

permissions:
  contents: read

jobs:
  compare:
    name: Compare ${{ inputs.environment || 'test' }} with the repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment == 'production' && 'production' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENT: ${{ inputs.environment || 'test' }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Build what Terraform reads (the access gate and the placeholder)
        run: |
          npm ci
          node scripts/src/build.ts compare
          (cd dist/placeholder && zip -qr ../placeholder.zip .)

      - name: Take the environment's identity (one hour, no stored keys)
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ inputs.environment == 'production' && vars.AWS_ROLE_PRODUCTION || vars.AWS_ROLE_TEST }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Terraform's plan; nothing is applied
        working-directory: infra/environment
        run: |
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"
          set +e
          terraform plan -input=false -lock=false -detailed-exitcode -var-file="${ENVIRONMENT}.tfvars"
          RESULT=$?
          set -e
          if [ "${RESULT}" -eq 0 ]; then
            echo "No difference: ${ENVIRONMENT} is as the repository defines it." | tee -a "${GITHUB_STEP_SUMMARY}"
          elif [ "${RESULT}" -eq 2 ]; then
            echo "::error::${ENVIRONMENT} differs from what the repository defines. The plan above lists the differences; nothing was changed."
            exit 1
          else
            echo "::error::The comparison itself failed."
            exit "${RESULT}"
          fi
