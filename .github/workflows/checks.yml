# Everything that must pass before a pull request can be merged (pipeline
# design, "checks"). These jobs need no AWS access and are given no permission
# to ask for an AWS token.
name: checks

on:
  pull_request:
    branches: [aws-migration]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install, exactly from the lockfile
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests, with the 80% coverage floor
        run: npm run test:coverage

      - name: Build the Release, with the page's size limit
        run: npm run build

      - name: Repository checks
        run: npm run repo-checks

      - name: Dependencies
        run: npm audit --audit-level=high

      - name: Secrets
        run: >
          docker run --rm -v "${PWD}:/repository" -w /repository
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --log-opts="origin/${GITHUB_BASE_REF}..HEAD"

      - name: Compatibility with every version in reach
        # The version running in production, and the one going back would
        # restore, must still work against a database that has this pull
        # request's database changes (reliability design R5).
        #
        # For each such Release: its commit is checked out beside this one,
        # this pull request's SQL files take the place of its own, and that
        # Release's tests of the server are run. Each of those tests starts
        # an empty PostgreSQL and applies every SQL file it finds before the
        # server reads from it, so the Release's server code runs against the
        # pull request's changes.
        #
        # Only the tests under server/ are run. The Release's tests of the
        # change runner (under db-migrate/) and of the build (under scripts/)
        # describe the SQL files that Release had, and say nothing about
        # whether its server still works. A Release's checkout is frozen, so
        # the rule must hold for every Release: the server's tests live under
        # server/ and get their database from
        # db-migrate/src/testing/postgres.ts, which applies the folder
        # db-migrate/migrations. Keep both true (docs/examples.md).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=releases-production&per_page=100" > deployments.json
          node scripts/src/deployment-record.ts in-reach < deployments.json > in-reach.txt
          if [ ! -s in-reach.txt ]; then
            echo "No Release is in reach yet (nothing has been deployed to production), so there is nothing to check compatibility with."
            exit 0
          fi
          # The list is read on a channel of its own (3), not on standard
          # input: a command inside the loop that read standard input would
          # otherwise swallow the next Release's line, and the check would
          # pass without having tested that Release. For the same reason the
          # Releases tested are counted and compared with the list.
          EXPECTED="$(grep -c . in-reach.txt)"
          TESTED=0
          while read -r RELEASE SHA _ <&3; do
            echo "::group::Release ${RELEASE}: its server's tests against this pull request's database changes"
            git worktree add --detach "../reach-${RELEASE}" "${SHA}"
            if [ ! -d "../reach-${RELEASE}/server" ] || [ ! -f "../reach-${RELEASE}/db-migrate/src/testing/postgres.ts" ]; then
              echo "::error::Release ${RELEASE} does not have its server's tests where this check expects them. The check proved nothing and fails."
              exit 1
            fi
            rm -rf "../reach-${RELEASE}/db-migrate/migrations"
            cp -R db-migrate/migrations "../reach-${RELEASE}/db-migrate/migrations"
            (cd "../reach-${RELEASE}" && npm ci && npx vitest run server) < /dev/null
            TESTED=$((TESTED + 1))
            echo "::endgroup::"
          done 3< in-reach.txt
          if [ "${TESTED}" -ne "${EXPECTED}" ]; then
            echo "::error::${EXPECTED} Releases are in reach and ${TESTED} were tested. The check proved less than it must and fails."
            exit 1
          fi
          echo "Tested ${TESTED} of ${EXPECTED} Releases in reach."
          echo "NOTE: the page's end-to-end tests of each version in reach are not yet run against this pull request's server; that half of the check needs a way to start the server locally, which does not exist yet."

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive infra

      - name: Terraform validation, with no backend and no identity
        run: |
          for configuration in infra/setup infra/environment; do
            terraform -chdir="${configuration}" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="${configuration}" validate
          done

      - name: Terraform's own tests (no AWS account is touched)
        run: |
          terraform -chdir=infra/setup test
          terraform -chdir=infra/environment test

      - name: Infrastructure scan
        run: |
          python3 -m pip install --quiet --disable-pip-version-check checkov==3.4.11
          checkov --config-file .checkov.yaml

  description:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The pull request names its Unit
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n%s\n' "${TITLE}" "${BODY}" | grep -Eq '(^|[^A-Za-z0-9])[Uu][0-9]+([^A-Za-z0-9]|$)'; then
            echo "The pull request names its Unit."
          else
            echo "::error::The pull request's title or description must name the Unit it belongs to (for example: U1)."
            exit 1
          fi
